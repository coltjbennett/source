<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Arcade Hub - Project Launcher</title>
  <link rel="icon" href="https://coltjbennett.github.io/games-hub/images/icon.JPG">
  <link rel="stylesheet" href="https://coltjbennett.github.io/games-hub/styles.css" />

  <!-- Preload Ruffle Globally -->
  <script>
    window.RufflePlayer = window.RufflePlayer || {};

  <style>
    /* ===== DISABLE CRT OVERLAYS & FILTERS (PRESERVES TILED BACKGROUND) ===== */
    html::after {
      display: none !important;
      content: none !important;
      background: none !important;
    }

    html, body, .page-shell, .panel, .panel-dark, .arcade-card, #game-modal, * {
      filter: none !important;
      backdrop-filter: none !important;
      text-shadow: none !important;
      animation: none !important;
    }

    img {
      filter: none !important;
      image-rendering: auto !important;
    }

    /* ===== SUPPLEMENTARY STYLES ===== */
    .arcade-grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    }

    .arcade-card {
      cursor: pointer;
    }

    .arcade-card .card-image {
      aspect-ratio: 1 / 1;
      background: var(--win-bg);
      border-bottom: 2px inset var(--win-border-dark);
      padding: 6px;
    }

    .arcade-card .card-image img {
      object-fit: cover;
      width: 100%;
      height: 100%;
      border: 2px inset var(--win-border-dark);
      background: var(--win-blue);
    }

    .arcade-card .card-body {
      align-items: center;
      justify-content: center;
      padding: 8px 10px;
    }

    .arcade-card h3 {
      text-align: center;
      margin: 0;
      font-size: 1rem;
      overflow-wrap: anywhere;
    }

    .status-container {
      grid-column: 1 / -1;
      padding: 40px;
      text-align: center;
      font-weight: bold;
      color: var(--win-text-dark);
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <div class="page-shell">

    <!-- Header -->
    <header>
      <div class="panel-dark">
        <div class="panel-title-bar w95-text">
          <span>ARCADE HUB</span>
          <span class="win-btns">
            <button type="button" class="win-btn btn-minimize" aria-label="Minimize">-</button>
            <button type="button" class="win-btn btn-maximize" aria-label="Maximize" disabled>□</button>
            <button type="button" class="win-btn btn-close" aria-label="Close" disabled>✕</button>
          </span>
        </div>
        <div class="panel-body">
          <div class="header-top-banner">GAME DIRECTORY</div>
          <h1>ARCADE HUB</h1>
          <p class="hero-copy">Browse, search, and play games straight from your local library.</p>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main>
      <div class="panel">
        <div class="panel-title-bar w95-text">
          <span>GAME LIBRARY</span>
          <span class="win-btns">
            <button type="button" class="win-btn btn-minimize" aria-label="Minimize">-</button>
            <button type="button" class="win-btn btn-maximize" aria-label="Maximize" disabled>□</button>
          </span>
        </div>
        <div class="panel-body">

          <!-- Search Toolbar -->
          <div class="controls-row">
            <p class="hint">Type to filter games below. <span id="game-count"></span></p>
            <div class="toolbar">
              <input type="text" id="search" class="search-input" placeholder="Search games..." style="width: 250px;">
            </div>
          </div>

          <!-- Game Grid -->
          <div id="grid" class="arcade-grid">
            <div class="status-container">Loading arcade library... please wait.</div>
          </div>

        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer>
      <p>Local Arcade Library</p>
      <p class="footer-note w95-text">Best viewed with a monitor</p>
    </footer>

  </div>

  <!-- Taskbar -->
  <div class="taskbar">
    <button type="button" class="taskbar-start" onclick="window.location.href='index.html'">

      Start
    </button>
    <div class="taskbar-spacer"></div>
    <div class="taskbar-status">
      <div class="taskbar-clock w95-text">Arcade Hub Active</div>
    </div>
  </div>

  <!-- Unified Game Modal Window (Handles Flash & HTML5) -->

        <span id="modal-title">Game Player</span>
        <span class="win-btns">
          <button type="button" class="win-btn btn-close" id="modal-close" aria-label="Close" style="cursor:pointer;">✕</button>
        </span>
      </div>
      <!-- Viewport Container -->

        <div id="game-container" style="flex: 1; width: 100%; height: 100%; background: #000;"></div>

    // ===== HELPERS =====
    // Encode each path segment (keeps "/" separators) so names like "pip!" or "fireboy&watergirl.swf" resolve safely.
    function encodePath(p) {
      return p.split('/').map(encodeURIComponent).join('/');
    }

    // Escape text for safe insertion into HTML text/attribute contexts.
    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatTitle(name) {
      return name
        .replace(/[-_]/g, ' ')
        .replace(/\b\w/g, char => char.toUpperCase());
    }

    // ===== BUILD GAME OBJECTS =====
    // Same structure as the original: SWF -> `${name}`, folder -> `${name}/index.html`
    // (raw names, no encoding, local relative paths only)
    const games = LOCAL_GAMES.map((entry, index) => {
      const isSwf = entry.toLowerCase().endsWith('.swf');
      const baseName = isSwf ? entry.replace(/\.swf$/i, '') : entry;

      return {
        id: index,
        name: entry,
        baseName: baseName,
        title: formatTitle(baseName),
        path: isSwf
          ? `${entry}`
          : `${entry}/index.html`,
        isSwf: isSwf
      };
    });

    // ===== RENDERING =====
    const grid = document.getElementById('grid');
    const countEl = document.getElementById('game-count');

    function renderGrid(gameList) {
      countEl.textContent = `(${gameList.length} of ${games.length})`;

      if (gameList.length === 0) {
        grid.innerHTML = `<div class="status-container">No games matching your search.</div>`;
        return;
      }

      grid.innerHTML = gameList.map(game => {
        const safeTitle = escapeHTML(game.title);

        // SWF: no icon search, go straight to the fallback icon.
        // HTML folder: try local "<folder>/icon.png" first, then cascade via tryNextIcon.
        const imgTag = game.isSwf
          ? `<img src="${FALLBACK_ICON}" alt="${safeTitle}" loading="lazy" />`
          : `<img src="${encodePath(game.baseName)}/${ICON_CANDIDATES[0]}"
                  alt="${safeTitle}"
                  loading="lazy"
                  data-folder="${escapeHTML(encodePath(game.baseName))}"
                  data-icon-index="0" />`;

        return `
          <div class="project-card arcade-card" data-id="${game.id}" role="button" tabindex="0">
            <div class="card-image">${imgTag}</div>
            <div class="card-body">
              <h3>${safeTitle}</h3>
            </div>
          </div>`;
      }).join('');
    }

    // Icon cascade for HTML folders (error events don't bubble, so use capture on the grid).
    function tryNextIcon(img) {
      const folder = img.dataset.folder;
      const next = parseInt(img.dataset.iconIndex, 10) + 1;

      if (next < ICON_CANDIDATES.length) {
        img.dataset.iconIndex = next;
        img.src = `${folder}/${ICON_CANDIDATES[next]}`;
      } else {
        // Out of candidates: stop looping and use the fallback.
        delete img.dataset.folder;
        img.src = FALLBACK_ICON;
      }
    }

    grid.addEventListener('error', (e) => {
      const img = e.target;
      if (img.tagName === 'IMG' && img.dataset.folder) {
        tryNextIcon(img);
      }
    }, true);

    // ===== CARD CLICKS (delegated; no inline handlers, so quotes/ampersands can't break anything) =====
    function handleCardActivate(e) {
      const card = e.target.closest('.arcade-card');
      if (!card) return;
      const game = games[parseInt(card.dataset.id, 10)];
      if (game) openGame(game);
    }

    grid.addEventListener('click', handleCardActivate);
    grid.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        handleCardActivate(e);
      }
    });

    // ===== SEARCH =====
    document.getElementById('search').addEventListener('input', (e) => {
      const term = e.target.value.trim().toLowerCase();
      const filtered = games.filter(g =>
        g.title.toLowerCase().includes(term) || g.name.toLowerCase().includes(term)
      );
      renderGrid(filtered);
    });

    // ===== MODAL =====
    const modal = document.getElementById('game-modal');
    const container = document.getElementById('game-container');

    // Opens both HTML5 and Flash/SWF games inside the custom window modal
    function openGame(game) {
      // Update Title Bar
      document.getElementById('modal-title').innerText = game.title + (game.isSwf ? ' - Flash Arcade' : ' - HTML Arcade');

      // Clear previous content
      container.innerHTML = '';

      if (game.isSwf) {
        // Embed Ruffle Player for SWF files (identical to original)
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        player.style.width = '100%';
        player.style.height = '100%';

        container.appendChild(player);
        player.load(game.path);
      } else {
        // Embed iframe for HTML5 games
        const iframe = document.createElement('iframe');
        iframe.src = game.path;
        iframe.style.width = '100%';
        iframe.style.height = '100%';
        iframe.style.border = 'none';
        iframe.allow = 'autoplay; fullscreen; keyboard';

        container.appendChild(iframe);
      }

      // Display window modal
      modal.style.display = 'flex';
    }

    // Close modal and unload game frame/sound
    function closeModal() {
      modal.style.display = 'none';
      container.innerHTML = '';
    }

    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.style.display !== 'none') closeModal();
    });

    // ===== INIT =====
    renderGrid(games);
  </script>
